name: Generate arcade contribution graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/arcade.yml", ".github/arcade/**"]

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # If the API call fails, this step fails and the last good image stays published.
      - name: Build arcade SVG
        run: python3 .github/arcade/build.py "${{ github.repository_owner }}" dist/arcade.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub disables scheduled workflows after 60 days without repo activity;
  # this re-enables the schedule so the graph keeps refreshing.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
